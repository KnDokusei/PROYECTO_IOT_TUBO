## Managed dependencies, resolved by the IDF component manager.
## Versions are pinned to a compatible range and frozen in dependencies.lock,
## which is what makes this build reproducible on another machine -- the gap the
## Arduino build never closed (five libraries, none version-pinned).
dependencies:
  idf:
    version: ">=5.3"
  espressif/esp_websocket_client:
    version: "^1.5.0"
